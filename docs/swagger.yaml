basePath: /api/v1
definitions:
  internal_job_adapter.CreateJobRequest:
    properties:
      payload:
        example: '{"image_url":"https://example.com/image.jpg"}'
        type: string
      type:
        allOf:
        - $ref: '#/definitions/selfier_internal_job_core.JobType'
        enum:
        - deselfie
        example: deselfie
    required:
    - payload
    - type
    type: object
  internal_job_adapter.GinError:
    properties:
      error:
        type: string
    type: object
  internal_job_adapter.JobResponse:
    properties:
      error:
        example: an error occurred
        type: string
      id:
        example: job-12345
        type: string
      payload:
        example: '{"image_url":"https://example.com/image.jpg"}'
        type: string
      result:
        example: '{"processed_url":"https://example.com/result.jpg"}'
        type: string
      status:
        allOf:
        - $ref: '#/definitions/selfier_internal_job_core.JobStatus'
        example: pending
      type:
        allOf:
        - $ref: '#/definitions/selfier_internal_job_core.JobType'
        example: deselfie
    type: object
  selfier_internal_job_core.JobStatus:
    enum:
    - pending
    - processing
    - completed
    - failed
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusProcessing
    - StatusCompleted
    - StatusFailed
  selfier_internal_job_core.JobType:
    enum:
    - deselfie
    type: string
    x-enum-varnames:
    - JobTypeDeselfie
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the API for creating and managing jobs in the Selfier service.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Selfier Job Service API
  version: "1.0"
paths:
  /jobs:
    get:
      description: Retrieves a list of all jobs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_job_adapter.JobResponse'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_job_adapter.GinError'
      summary: Get all jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: |-
        Creates a new job. The structure of the 'payload' depends on the 'type'.
        For 'deselfie', the payload must be `{"image_url": "string"}`.
      parameters:
      - description: Create Job Request
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/internal_job_adapter.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_job_adapter.JobResponse'
        "400":
          description: Invalid request body or payload
          schema:
            $ref: '#/definitions/internal_job_adapter.GinError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_job_adapter.GinError'
      summary: Create a new job
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Deletes a job by its unique ID.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_job_adapter.GinError'
      summary: Delete a job by ID
      tags:
      - jobs
    get:
      description: Retrieves a single job by its unique ID.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_job_adapter.JobResponse'
        "404":
          description: Job not found
          schema:
            $ref: '#/definitions/internal_job_adapter.GinError'
      summary: Get a job by ID
      tags:
      - jobs
schemes:
- http
swagger: "2.0"

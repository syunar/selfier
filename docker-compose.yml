version: "3.8"

services:
  # Go Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: go-builder
    image: selfier-backend:latest
    container_name: selfier-backend
    restart: unless-stopped
    command: /app/bin/selfier
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      PRIMARY_ENV: ${PRIMARY_ENV:-production}
      SERVER_PORT: 8080
      SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT:-15}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-15}
      SERVER_IDLE_TIMEOUT: ${SERVER_IDLE_TIMEOUT:-60}
      SERVER_CORS_ALLOWED_ORIGINS: ${SERVER_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-selfier_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-selfier_password}
      DATABASE_NAME: ${DATABASE_NAME:-selfier_db}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-25}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-300}
      DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-120}

      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_UPLOAD_BUCKET: ${AWS_UPLOAD_BUCKET}

      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}

      REDIS_ADDRESS: ${REDIS_ADDRESS:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-builder
    image: selfier-frontend:latest
    container_name: selfier-frontend
    restart: unless-stopped
    command: sh -c "cd /app/web && npx prisma migrate deploy && npm run start"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://${DATABASE_USER:-selfier_user}:${DATABASE_PASSWORD:-selfier_password}@db:5432/${DATABASE_NAME:-selfier_db}?schema=public
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: selfier-network
